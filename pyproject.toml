[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs769-memory"
version = "0.1.0"
description = "Configurable graph-memory experiments with unchanged BFCL evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cs769 = "cs769.cli:main"

[tool.setuptools]
packages = ["cs769", "cs769.adapters", "cs769.tests", "cs769.base", "cs769.datasets", "cs769.models", "cs769.models.graphs", "cs769.models.edits", "cs769.tasks"]
package-dir = {"" = "src", "cs769.base" = "base", "cs769.datasets" = "datasets", "cs769.models" = "models", "cs769.tasks" = "tasks"}

[tool.setuptools.package-data]
cs769 = ["configs/*.json", "examples/*.json"]
